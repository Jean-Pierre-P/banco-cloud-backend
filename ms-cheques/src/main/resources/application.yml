server:
  port: 8081

spring:
  application:
    name: ms-cheques
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:admin}
    password: ${RABBIT_PASS:admin123}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}

app:
  security:
    roles-claim: ${JWT_ROLES_CLAIM:roles}
  rabbitmq:
    exchanges:
      principal: banco.cheques.exchange
    queues:
      emision: banco.cheques.emision.queue
      acceso: banco.usuarios.acceso.queue
    routing-keys:
      emision: banco.routing.emision
      acceso: banco.routing.acceso
      cheque-emitido: cheque.emitido
      cheque-estado: cheque.estado
      cheque-devuelto: cheque.devuelto