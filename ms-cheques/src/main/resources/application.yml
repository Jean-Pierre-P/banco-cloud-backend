server:
  port: 8081

spring:
  application:
    name: ms-cheques
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/banco_cloud}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}          # viene de variable de entorno, no se escribe aquí
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI}   # URL del IDaaS (Cognito, Auth0, Keycloak...)

app:
  security:
    roles-claim: ${JWT_ROLES_CLAIM:roles}  # claim del JWT con los roles (ej: roles, cognito:groups)
  # Nombres de mensajería CENTRALIZADOS: no hay strings sueltos en el código
  messaging:
    exchange: banco.cheques.exchange
    routing-keys:
      cheque-emitido: cheque.emitido
      cheque-estado: cheque.estado
      cheque-devuelto: cheque.devuelto
