server:
  port: 8081

spring:
  application:
    name: ms-cheques
  datasource:
    url: ${DB_URL:jdbc:h2:mem:bancocloud;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER:admin}
    password: ${RABBIT_PASS:admin123}

app:
  rabbitmq:
    exchanges:
      principal: banco.cheques.exchange
    queues:
      emision: banco.cheques.emision.queue
      acceso: banco.usuarios.acceso.queue
    routing-keys:
      emision: banco.routing.emision
      acceso: banco.routing.acceso