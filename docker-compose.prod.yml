services:
  rabbitmq:
    image: rabbitmq:3.13-management
    hostname: rabbit1
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
      RABBITMQ_ERLANG_COOKIE: ${ERLANG_COOKIE}
    ports:
      - "15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    networks:
      default:
        aliases:
          - rabbit1
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  rabbitmq2:
    image: rabbitmq:3.13-management
    hostname: rabbit2
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASS}
      RABBITMQ_ERLANG_COOKIE: ${ERLANG_COOKIE}
    volumes:
      - rabbit2-data:/var/lib/rabbitmq
    networks:
      default:
        aliases:
          - rabbit2
    depends_on:
      rabbitmq:
        condition: service_healthy

  ms-notificaciones:
    build:
      context: .
      args:
        MODULE: ms-notificaciones
    restart: unless-stopped
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASS: ${RABBIT_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy

  ms-cheques:
    build:
      context: .
      args:
        MODULE: ms-cheques
    restart: unless-stopped
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASS: ${RABBIT_PASS}
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      JWT_ROLES_CLAIM: ${JWT_ROLES_CLAIM}
      APP_CORS_ALLOWED_ORIGINS: https://${SITE_ADDRESS},http://localhost:4200
    depends_on:
      - ms-notificaciones

  ms-rabbit-admin:
    build:
      context: .
      args:
        MODULE: ms-rabbit-admin
    restart: unless-stopped
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER}
      RABBIT_PASS: ${RABBIT_PASS}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI}
      JWT_ROLES_CLAIM: ${JWT_ROLES_CLAIM}
    depends_on:
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: ../frontend-banco-cloud
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - ms-cheques

volumes:
  rabbit-data:
  rabbit2-data:
  caddy-data: