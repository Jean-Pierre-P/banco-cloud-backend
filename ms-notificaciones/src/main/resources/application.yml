server:
  port: 8082

spring:
  application:
    name: ms-notificaciones
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: manual     # ACK explícito en cada consumidor
        prefetch: 10

# Toda la topología de mensajería está CENTRALIZADA aquí
app:
  messaging:
    exchange: banco.cheques.exchange
    dead-letter-exchange: banco.cheques.dlx
    queues:
      cheque-emitido:
        name: cheque.emitido.queue
        routing-key: cheque.emitido
        dlq: cheque.emitido.dlq
      cheque-estado:
        name: cheque.estado.queue
        routing-key: cheque.estado
        dlq: cheque.estado.dlq
      cheque-devuelto:
        name: cheque.devuelto.queue
        routing-key: cheque.devuelto
        dlq: cheque.devuelto.dlq
